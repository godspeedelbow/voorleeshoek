name: Publish Voorleeshoek

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Add release details to the footer
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          sha = os.environ["GITHUB_SHA"]
          commit_url = f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/commit/{sha}'
          published = datetime.now(ZoneInfo("Europe/Amsterdam"))
          footer = (
              f'<footer><span data-text="version">Versie</span> <a href="{commit_url}">{sha[:7]}</a> · '
              f'<span data-text="updated">Bijgewerkt op</span> <time id="published-at" datetime="{published.isoformat(timespec="seconds")}">'
              f'{published:%d-%m-%Y om %H:%M}</time></footer>'
          )
          path = Path("dist/index.html")
          html = path.read_text(encoding="utf-8")
          marker = "<!-- release-metadata -->"
          if html.count(marker) != 1:
              raise SystemExit("Expected exactly one release metadata marker")
          path.write_text(html.replace(marker, footer), encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
